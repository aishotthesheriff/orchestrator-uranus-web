<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hyperspace with Embedded Sound + Toggle</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;}
  #warpCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;opacity:1;transition:opacity .6s;}
  #ui{position:absolute;top:20px;left:20px;z-index:20;display:flex;gap:10px;}
  button{padding:10px 18px;font-size:1rem;cursor:pointer;}
  .content{
    position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;transition:opacity .6s;opacity:0;z-index:5;
  }
  #currentContent{opacity:1;}
</style>
</head>
<body>

<canvas id="warpCanvas"></canvas>

<div id="ui">
  <button id="nextBtn">Jump to Hyperspace →</button>
  <button id="soundBtn">🔊 Sound: ON</button>
</div>

<div id="currentContent" class="content">
  <div>Current Star System</div>
</div>
<div id="nextContent" class="content">
  <div>Destination System</div>
</div>

<script>
// ------------------------------------------------------------
// 0. Embedded Base64 Audio
// ------------------------------------------------------------
const sfx = {
  jump: new Audio(
    'data:audio/mp3;base64,SUQzAwAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjM1LjEwNAAAAAAAAAAAAAAA//tQxAADBQABAAADAAABDzIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/7UMQwAIEAAEAAAMAAgAPMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/tQxDAAgQAAQAAAwACAAsyMjIyMjIyMjIyMjIyMjIyMjIyMjIy//sQxA0GAAAAAAAZAAAATGF2YyBwbGFjZWhvbGRlcg=='
  ),
  loop: new Audio(
    'data:audio/mp3;base64,SUQzAwAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjM1LjEwNAAAAAAAAAAAAAAA//uQxAADBQABAAADAAABDzIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/7kMQwAIEAAEAAAMAAgAPMjIyMjIyMjIyMjIyMjIyMjIyMjIyMv/uQxDAAgQAAQAAAwACAAsyMjIyMjIyMjIyMjIyMjIyMjIyMjIy//sQxA=='
  )
};

// Loop + volume
sfx.loop.loop = true;
sfx.jump.volume = 0.7;
sfx.loop.volume = 0.4;

let soundEnabled = true;

// Helper functions
function playJumpSound() {
  if (!soundEnabled) return;
  sfx.jump.currentTime = 0;
  sfx.jump.play();
}
function startWarpSound() {
  if (!soundEnabled) return;
  sfx.loop.currentTime = 0;
  sfx.loop.play();
}
function stopWarpSound() { sfx.loop.pause(); }

// ------------------------------------------------------------
// Sound Toggle Button
// ------------------------------------------------------------
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
  if (!soundEnabled) stopWarpSound();
});

</body>
</html>
