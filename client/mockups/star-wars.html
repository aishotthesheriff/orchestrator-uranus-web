<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Wars Hyperspace (Centered & Enhanced)</title>
<style>
  html,body{
    margin:0;height:100%;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;background:#000;color:#fff;
  }
  #warpCanvas{
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:10;opacity:1;transition:opacity .6s;
  }
  #ui{
    position:absolute;top:20px;left:20px;z-index:20;
  }
  button{padding:12px 24px;font-size:1rem;margin-right:10px;cursor:pointer;}
  .content{
    position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;opacity:0;transition:opacity .6s;
  }
  #currentContent{opacity:1;z-index:5;}
  #nextContent{z-index:5;}
</style>
</head>
<body>

<canvas id="warpCanvas"></canvas>

<div id="ui">
  <button id="nextBtn">Jump to Hyperspace →</button>
</div>

<div id="currentContent" class="content">
  <div>Current Star System</div>
</div>

<div id="nextContent" class="content">
  <div>Destination System</div>
</div>

<script>
// ------------------------------------------------------------
// 1. Canvas Setup
// ------------------------------------------------------------
const canvas = document.getElementById('warpCanvas');
const ctx = canvas.getContext('2d');
let w, h, cx, cy;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  cx = w / 2; // true center
  cy = h / 2;
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------
// 2. Starfield
// ------------------------------------------------------------
const STAR_COUNT = 800;
const stars = [];

class Star {
  constructor() { this.reset(true); }
  reset(isNormal = false) {
    this.x = (Math.random() - 0.5) * w * 2;
    this.y = (Math.random() - 0.5) * h * 2;
    this.z = isNormal ? Math.random() * 600 + 200 : Math.random() * 500 + 200;
    this.baseZ = this.z;
    this.size = 1.4;
    this.twinklePhase = Math.random() * Math.PI * 2;
  }
}

for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());

// ------------------------------------------------------------
// 3. State Machine / Phases
// ------------------------------------------------------------
const PHASES = { NORMAL:0, FADE_OUT:1, FLASH:2, WARP:3, FADE_IN:4, DONE:5 };
let phase = PHASES.NORMAL;
let phaseTimer = 0;
let flashAlpha = 0;

const DUR = {
  FADE_OUT: 0.4,
  FLASH: 0.2,
  WARP: 2.0,
  FADE_IN: 0.5
};

// ------------------------------------------------------------
// 4. Animation Loop
// ------------------------------------------------------------
let last = 0;
function animate(t = 0) {
  const dt = Math.min((t - last) / 1000, 0.1);
  last = t;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  phaseTimer += dt;

  if (phase === PHASES.NORMAL || phase === PHASES.FADE_IN || phase === PHASES.DONE) {
    drawNormalStarfield();
  }

  if (phase === PHASES.FADE_OUT) {
    drawNormalStarfield(true);
    if (phaseTimer >= DUR.FADE_OUT) nextPhase();
  }

  if (phase === PHASES.FLASH) {
    drawRadialFlash();
    if (phaseTimer >= DUR.FLASH) nextPhase();
  }

  if (phase === PHASES.WARP) {
    drawWarpStarfield(dt);
    if (phaseTimer >= DUR.WARP) nextPhase();
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ------------------------------------------------------------
// 5. Draw Functions
// ------------------------------------------------------------
function drawNormalStarfield(freeze = false) {
  for (const s of stars) {
    if (!freeze) {
      s.twinklePhase += 0.002;
    }
    const twinkle = 0.6 + 0.4 * Math.sin(s.twinklePhase);
    const size = s.size * twinkle;
    ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
    ctx.fillRect(cx + s.x - size/2, cy + s.y - size/2, size, size);
  }
}

function drawWarpStarfield(dt) {
  const speed = 1300 + Math.sin(phaseTimer * 2) * 400;
  for (const s of stars) {
    s.z -= speed * dt;
    if (s.z <= 0) s.reset();

    const projX = (s.x / s.z) * 300 + cx;
    const projY = (s.y / s.z) * 300 + cy;
    const size = (400 / s.z) * 1.4;
    const alpha = 1 - (s.z / 800);

    const tailX = projX - (projX - cx) * 0.1;
    const tailY = projY - (projY - cy) * 0.1;

    ctx.strokeStyle = `rgba(240,250,255,${alpha})`;
    ctx.lineWidth = size * 0.3;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(projX, projY);
    ctx.stroke();
  }
}

function drawRadialFlash() {
  flashAlpha = Math.sin((phaseTimer / DUR.FLASH) * Math.PI);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1 + flashAlpha * 0.3, 1 + flashAlpha * 0.3);
  ctx.translate(-cx, -cy);
  drawNormalStarfield();
  ctx.restore();
  ctx.fillStyle = `rgba(220,240,255,${flashAlpha * 0.9})`;
  ctx.fillRect(0,0,w,h);
}

// ------------------------------------------------------------
// 6. Control
// ------------------------------------------------------------
function nextPhase() {
  phaseTimer = 0;
  phase++;
  if (phase === PHASES.DONE) endTransition();
}

function endTransition() {
  canvas.style.opacity = '0';
  document.getElementById('nextContent').style.opacity = '1';
  document.getElementById('currentContent').style.opacity = '0';
}

// ------------------------------------------------------------
// 7. Button Controls
// ------------------------------------------------------------
document.getElementById('nextBtn').addEventListener('click', () => {
  const btn = document.getElementById('nextBtn');
  btn.disabled = true;
  btn.textContent = 'Jumping…';

  stars.forEach(s => s.reset(true));
  phase = PHASES.FADE_OUT;
  phaseTimer = 0;
  flashAlpha = 0;
  canvas.style.opacity = '1';

  const onDone = () => {
    btn.disabled = false;
    btn.textContent = 'Jump to Hyperspace →';
    canvas.removeEventListener('transitionend', onDone);
  };
  canvas.addEventListener('transitionend', onDone);
});
</script>
</body>
</html>
