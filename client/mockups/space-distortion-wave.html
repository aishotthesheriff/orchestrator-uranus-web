<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp Drive - Space Distortion Wave</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px #00ffff;
        }

        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #00ffff;
            font-size: 24px;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">SPACE DISTORTION WAVE</div>
        <canvas id="warpCanvas"></canvas>
        <div class="controls">
            <button id="toggleBtn">Start Warp</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let isActive = false;
        let time = 0;
        let backgroundImage = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createBackground();
        }

        function createBackground() {
            // Create a simple starfield background
            backgroundImage = document.createElement('canvas');
            backgroundImage.width = canvas.width;
            backgroundImage.height = canvas.height;
            const bgCtx = backgroundImage.getContext('2d');
            
            bgCtx.fillStyle = '#000';
            bgCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            bgCtx.fillStyle = '#fff';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 2;
                bgCtx.beginPath();
                bgCtx.arc(x, y, size, 0, Math.PI * 2);
                bgCtx.fill();
            }
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function getDistortion(x, y, t) {
            if (!isActive) return { x, y };
            
            // Create wave distortion effect
            const wave1 = Math.sin((x * 0.01 + t * 0.5) * Math.PI) * 30;
            const wave2 = Math.cos((y * 0.01 + t * 0.3) * Math.PI) * 20;
            const ripple = Math.sin(Math.sqrt((x - canvas.width/2)**2 + (y - canvas.height/2)**2) * 0.05 - t * 2) * 40;
            
            return {
                x: x + wave1 + ripple * 0.5,
                y: y + wave2 + ripple * 0.5
            };
        }

        function drawDistorted() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background with distortion
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const bgData = backgroundImage.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const dist = getDistortion(x, y, time);
                    const srcX = Math.floor(dist.x);
                    const srcY = Math.floor(dist.y);
                    
                    if (srcX >= 0 && srcX < canvas.width && srcY >= 0 && srcY < canvas.height) {
                        const srcIndex = (srcY * canvas.width + srcX) * 4;
                        const dstIndex = (y * canvas.width + x) * 4;
                        
                        imageData.data[dstIndex] = bgData.data[srcIndex];
                        imageData.data[dstIndex + 1] = bgData.data[srcIndex + 1];
                        imageData.data[dstIndex + 2] = bgData.data[srcIndex + 2];
                        imageData.data[dstIndex + 3] = bgData.data[srcIndex + 3];
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Add color shift overlay
            if (isActive) {
                ctx.fillStyle = `rgba(100, 150, 255, ${0.3 + Math.sin(time) * 0.1})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function drawScanlines() {
            if (!isActive) return;
            
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            
            for (let y = 0; y < canvas.height; y += 2) {
                const distortion = getDistortion(canvas.width / 2, y, time);
                ctx.beginPath();
                ctx.moveTo(0, distortion.y);
                ctx.lineTo(canvas.width, distortion.y);
                ctx.stroke();
            }
        }

        function animate() {
            if (isActive) {
                time += 0.02;
            }
            
            drawDistorted();
            drawScanlines();

            requestAnimationFrame(animate);
        }

        document.getElementById('toggleBtn').addEventListener('click', () => {
            isActive = !isActive;
            document.getElementById('toggleBtn').textContent = isActive ? 'Stop Warp' : 'Start Warp';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isActive = false;
            time = 0;
            createBackground();
            document.getElementById('toggleBtn').textContent = 'Start Warp';
        });

        animate();
    </script>
</body>
</html>
