transformer_visual_styles:

    game:
    # Earlier eras (pre-NES)
    game_atari: "Atari 2600 game graphics with extremely blocky sprites and a very limited color palette, primitive pixel art"
    game_amiga: "Amiga 16-bit computer graphics featuring dithered shading and distinctive copper effects"
    game_ega_vga: "DOS game graphics in classic EGA/VGA style with a 16-color palette and CRT scanline aesthetic"
    
    # 8-bit era
    game_nes: "8-bit NES game graphics with chunky pixels and a characteristically limited color palette"
    
    # 16-bit era
    game_genesis: "Sega Genesis 16-bit graphics featuring blast processing effects and heavy dithering"
    game_snes: "Super Nintendo 16-bit graphics with Mode 7 rotation effects and smooth dithering"
    
    # Early 3D era
    game_ps1: "PlayStation 1 low-poly 3D graphics with vertex shading, warped textures, and wobbly geometry characteristic of early 3D games"
    game_n64: "Nintendo 64 low-poly 3D graphics with heavy fog effects, chunky models, and blurred textures"
    
    # 6th generation
    game_ps2: "PlayStation 2 graphics from the early 2000s with improved polygon count, texture filtering, and sharp edges"
    game_xbox: "Original Xbox graphics featuring normal mapping, bump mapping, and realistic lighting effects"
    game_gamecube: "GameCube stylized 3D graphics with cel shading, vibrant colors, and clean textures"
    
    # 7th generation (HD era)
    game_xbox360: "Xbox 360 HD graphics with normal maps, advanced shader effects, and bloom lighting"
    game_ps3: "PlayStation 3 HD era graphics with high polygon counts, realistic materials, and motion blur"
    game_wii: "Nintendo Wii graphics with stylized 3D rendering, soft lighting, and family-friendly aesthetics"
    
    # 8th generation
    game_ps4: "PlayStation 4 eighth generation graphics featuring physically based rendering and volumetric lighting"
    game_xboxone: "Xbox One modern console graphics with PBR materials and highly detailed textures"
    
    # Modern era
    game_ps5: "PlayStation 5 next-generation graphics with ray tracing, native 4K resolution, and ultra-realistic lighting"
    game_pc_modern: "Modern PC gaming on ultra settings with ray traced reflections and extreme detail"
    game_steam_deck: "Steam Deck portable PC graphics optimized for handheld performance"
    
    # Special categories
    game_gameboy: "Game Boy screen with a distinctive 4-color green monochrome palette on a dot matrix display"
    game_arcade: "Arcade cabinet game graphics with vibrant sprite art, saturated colors, and CRT screen glow"

    photo:
    # Early photography
    photo_daguerreotype: "A daguerreotype photograph from the 1850s with sepia tones, long exposure blur, and a distinctive mirror-like surface"
    photo_tintype: "A tintype photograph made with wet plate collodion process on a metallic surface, showing characteristic vignetting"
    photo_early_film: "Early film photography from the 1920s-1930s with grainy black and white tones and soft focus"
    
    # Classic film era
    photo_golden_age: "Film noir photography from the 1940s-1950s with high contrast, dramatic lighting, and deep blacks"
    photo_kodachrome: "Kodachrome film photograph from the 1960s with richly saturated colors, warm tones, and fine grain"
    photo_seventies: "1970s film photography with vintage color stock showing a warm cast, slight grain, and faded aesthetic"
    
    # Modern film era
    photo_eighties: "1980s color film photography with saturated colors, typical period lighting, and bold contrast"
    photo_nineties: "1990s 35mm film photograph with natural colors, fine grain, and balanced exposure"
    
    # Digital era
    photo_early_digital: "Early 2000s digital camera photograph with low megapixel resolution, visible digital noise, and limited dynamic range"
    photo_modern: "Modern high-resolution digital photography with clean image quality and computational processing"
    photo_ultra_high_res: "Ultra high resolution large format digital photograph with extreme detail and 100+ megapixels"
    
    # Mobile photography
    photo_flipphone: "Flip phone camera photograph with heavy noise, pixelation, and very low 1MP resolution"
    photo_early_smartphone: "Early smartphone photograph at 5MP with limited dynamic range, slight noise, and 720p quality"
    photo_smartphone: "Modern smartphone photograph with computational photography, HDR processing, and AI enhancement"
    
    # Special formats
    photo_polaroid: "Polaroid instant film photograph with chemical development artifacts, square format, and color shift with distinctive border"
    photo_medium_format: "Medium format photograph taken with a Hasselblad showing exceptional detail, tack sharpness, and shallow depth of field"
    photo_imax: "IMAX format photograph shot on 70mm film with extreme resolution, cinematic scale, and massive detail"

    cartoon:
    # Early animation
    cartoon_rubber_hose: "Rubber hose animation from the 1920s featuring bendy limbs, pie eyes, and circular forms in black and white"
    cartoon_fleischer: "Fleischer Studios 1930s animation with rotoscoped movement, surreal qualities, and bouncing characters"
    cartoon_disney_golden: "Golden age Disney animation with full animation, beautifully painted backgrounds, and realistic proportions"
    
    # Classic TV era
    cartoon_theatrical_golden: "Warner Bros theatrical cartoon with highly exaggerated expressions, dynamic action, and classic squash-and-stretch"
    cartoon_limited_animation: "Hanna-Barbera limited animation style with simple backgrounds, repeated cycles, and flat cel colors"
    cartoon_saturday_morning: "Saturday morning cartoon from the 1970s with flat cel colors and mystery-solving aesthetic"
    
    # 1980s-1990s
    cartoon_toy_commercial: "1980s toy commercial cartoon with bold outlines, muscular characters, and dramatic action poses"
    cartoon_disney_renaissance: "Disney Renaissance animation with Broadway musical quality, theatrical presentation, and detailed backgrounds"
    cartoon_gross_out: "Gross-out cartoon in the style of Ren & Stimpy with extreme close-ups, exaggerated details, and surreal imagery"
    cartoon_prime_time: "Prime time animated sitcom with yellow characters, simple designs, and satirical style"
    cartoon_geometric: "Late 90s Cartoon Network geometric style with bold colors, sharp angles, and anime influences"
    cartoon_nautical_surreal: "Nautical cartoon with surreal humor, highly expressive faces, and underwater SpongeBob aesthetic"
    
    # Digital era
    cartoon_flash_animation: "Flash animation with limited frames, vector-based art, stiff movement, and cutaway gags"
    cartoon_adventure: "Adventure cartoon with noodly limbs, pastel colors, simple shapes, and whimsical design"
    cartoon_calarts: "CalArts style contemporary cartoon with rounded designs, soft colors, and bean mouth characters"
    cartoon_sci_fi_adult: "Adult animated sci-fi cartoon with detailed backgrounds, expressive animation, and cynical humor"
    
    # Special categories
    cartoon_cutout: "Cutout animation in the style of South Park using construction paper aesthetic, crude simplicity, and flat layers"
    cartoon_anime_influenced: "Western anime-influenced animation in the style of Avatar with anime aesthetics, dynamic action, and Eastern influence"

    anime:
    # Classic era
    anime_astro_boy: "Tezuka style anime from the 1960s with limited animation, simple cel shading, and thick outlines"
    
