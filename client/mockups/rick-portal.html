<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rick & Morty Portal Gun Transition Effect</title>
<style>
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden;background:#000;color:#fff;}
  #portalCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;opacity:1;transition:opacity .6s;}
  #ui{z-index:20;position:absolute;top:20px;left:20px;}
  button{padding:12px 24px;font-size:1rem;margin-right:10px;cursor:pointer;}
  .content{
    position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;opacity:0;transition:opacity .6s;
  }
  #currentContent{opacity:1;z-index:5;background:linear-gradient(45deg,#0a192f,#001e3c);} /* Dark space-like */
  #nextContent{z-index:5;background:linear-gradient(45deg,#1b4332,#081c15);} /* Green-tinted next dimension */
</style>
</head>
<body>

<canvas id="portalCanvas"></canvas>

<div id="ui">
  <button id="nextBtn">Fire Portal Gun →</button>
</div>

<div id="currentContent" class="content">
  <div>🛸 Current Dimension</div>
</div>

<div id="nextContent" class="content">
  <div>🌌 Next Dimension (Wubba Lubba Dub Dub!)</div>
</div>

<script>
// ------------------------------------------------------------
// 1. Canvas & helpers
// ------------------------------------------------------------
const canvas = document.getElementById('portalCanvas');
const ctx = canvas.getContext('2d');
let w, h, cx, cy;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  cx = w / 2;
  cy = h / 2;
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------
// 2. Particles for chaotic swirling vortex (Rick & Morty green style)
// ------------------------------------------------------------
const PARTICLE_COUNT = 1200; // More particles for chaotic feel
const particles = [];

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 300 + 100; // Larger initial spread
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    this.vx = (Math.random() - 0.5) * 10; // Initial chaos
    this.vy = (Math.random() - 0.5) * 10;
    this.size = Math.random() * 4 + 2;
    this.life = 1;
    this.maxLife = Math.random() * 0.8 + 0.4;
    this.hue = 100 + Math.random() * 40; // Green tones (100-140 HSL)
    this.sparkle = Math.random() > 0.7; // Some particles sparkle white
  }
  update(dt, intensity) {
    // Chaotic swirl towards center
    const dx = cx - this.x;
    const dy = cy - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) {
      const pull = (1 - dist / 400) * intensity * 150 * dt; // Stronger pull
      this.vx += (dx / dist) * pull + (Math.random() - 0.5) * 20 * intensity * dt; // Add randomness for Rick & Morty wobble
      this.vy += (dy / dist) * pull + (Math.random() - 0.5) * 20 * intensity * dt;
      // Turbulent rotation
      const rotForce = intensity * 300 * dt / dist;
      this.vx += -dy / dist * rotForce;
      this.vy += dx / dist * rotForce;
    }
    // Update position
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.92; // Slightly more friction for fluid motion
    this.vy *= 0.92;
    // Fade life
    this.life -= dt / this.maxLife;
    if (this.life <= 0) this.reset();
  }
}

// Initialize particles
for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

// ------------------------------------------------------------
// 3. Portal rings (wavy, organic green rings)
// ------------------------------------------------------------
const rings = [];
for (let i = 0; i < 6; i++) {
  rings.push({
    radius: 60 + i * 50,
    thickness: 4 + i * 2,
    speed: 0.8 + i * 0.4,
    phase: Math.random() * Math.PI * 2,
    waveAmp: 10 + i * 5 // Wavy distortion for organic feel
  });
}

// ------------------------------------------------------------
// 4. Transition phases
// ------------------------------------------------------------
const PHASES = {
  IDLE: 0,
  OPEN: 1,
  ACTIVE: 2,
  CLOSE: 3,
  DONE: 4
};
let phase = PHASES.IDLE;
let phaseTimer = 0;

// Durations (seconds) - Slightly longer for dramatic effect
const DUR = {
  OPEN: 0.8,
  ACTIVE: 2.5,
  CLOSE: 0.8
};
let intensity = 0; // 0 to 1

// ------------------------------------------------------------
// 5. Mouse interaction (disabled - effect is centered)
// ------------------------------------------------------------

// ------------------------------------------------------------
// 6. Animation loop
// ------------------------------------------------------------
let last = 0;
function animate(t = 0) {
  const dt = Math.min((t - last) / 1000, 0.1);
  last = t;

  // Darken background with green tint
  ctx.fillStyle = `rgba(0, 20, 10, ${0.4 * intensity})`;
  ctx.fillRect(0, 0, w, h);

  // Keep center fixed at screen center
  cx = w / 2;
  cy = h / 2;

  // Phase logic
  phaseTimer += dt;
  switch (phase) {
    case PHASES.OPEN:
      intensity = easeInOutQuad(phaseTimer / DUR.OPEN);
      if (phaseTimer >= DUR.OPEN) {
        phase = PHASES.ACTIVE;
        phaseTimer = 0;
      }
      break;
    case PHASES.ACTIVE:
      intensity = 1;
      if (phaseTimer >= DUR.ACTIVE) {
        phase = PHASES.CLOSE;
        phaseTimer = 0;
      }
      break;
    case PHASES.CLOSE:
      intensity = easeInOutQuad(1 - phaseTimer / DUR.CLOSE);
      if (phaseTimer >= DUR.CLOSE) {
        phase = PHASES.DONE;
        endTransition();
      }
      break;
  }

  if (intensity > 0) {
    // Update particles
    particles.forEach(p => p.update(dt, intensity));

    // Draw particles
    particles.forEach(p => {
      const alpha = p.life * intensity * (0.6 + Math.random() * 0.4); // Flicker for energy
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = alpha;
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 4);
      if (p.sparkle) {
        grad.addColorStop(0, `rgba(255,255,255,${alpha})`); // White sparks
        grad.addColorStop(1, 'rgba(255,255,255,0)');
      } else {
        grad.addColorStop(0, `hsla(${p.hue}, 100%, 50%, ${alpha})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, p.size * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Draw wavy rings
    rings.forEach(ring => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(performance.now() * 0.001 * ring.speed + ring.phase);
      const alpha = intensity * 0.7;
      const grad = ctx.createRadialGradient(0, 0, ring.radius - ring.thickness, 0, 0, ring.radius + ring.thickness);
      grad.addColorStop(0, `hsla(${120 + ring.radius * 0.2}, 100%, 50%, ${alpha})`);
      grad.addColorStop(0.5, `hsla(${120 + ring.radius * 0.2}, 100%, 60%, ${alpha * 0.6})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = ring.thickness;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 2; a += 0.1) {
        const r = ring.radius + Math.sin(a * 8 + performance.now() * 0.002) * ring.waveAmp * intensity; // Wavy organic distortion
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    });

    // Central glow with green pulse
    const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.2 * intensity;
    const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 200 * pulse);
    glowGrad.addColorStop(0, 'hsla(120, 100%, 50%, 0.9)');
    glowGrad.addColorStop(0.3, 'hsla(120, 100%, 40%, 0.5)');
    glowGrad.addColorStop(1, 'rgba(0,50,20,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, 200 * pulse, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ------------------------------------------------------------
// 7. Helpers
// ------------------------------------------------------------
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function easeInOutQuad(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// ------------------------------------------------------------
// 8. Phase control
// ------------------------------------------------------------
function endTransition() {
  canvas.style.opacity = '0';
  document.getElementById('nextContent').style.opacity = '1';
  document.getElementById('currentContent').style.opacity = '0';
}

// ------------------------------------------------------------
// 9. UI trigger
// ------------------------------------------------------------
document.getElementById('nextBtn').addEventListener('click', () => {
  const btn = document.getElementById('nextBtn');
  btn.disabled = true;
  btn.textContent = 'Portal Opening…';

  // Hide current content
  document.getElementById('currentContent').style.opacity = '0';

  // Reset for portal
  phase = PHASES.OPEN;
  phaseTimer = 0;
  intensity = 0;
  canvas.style.opacity = '1';

  // Re-enable after
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = 'Fire Portal Gun →';
  }, (DUR.OPEN + DUR.ACTIVE + DUR.CLOSE) * 1000 + 600);
});
</script>
</body>
</html>
