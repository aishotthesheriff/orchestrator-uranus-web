<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hyperspace Jump Transition</title>
<style>
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden;background:#000;color:#fff;}
  #warpCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;opacity:1;transition:opacity .6s;}
  #ui{z-index:20;position:absolute;top:20px;left:20px;}
  button{padding:12px 24px;font-size:1rem;margin-right:10px;cursor:pointer;}
  .content{
    position:absolute;top:0;left:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;opacity:0;transition:opacity .6s;
  }
  #currentContent{opacity:1;z-index:5;}
  #nextContent{z-index:5;}
</style>
</head>
<body>

<canvas id="warpCanvas"></canvas>

<div id="ui">
  <button id="nextBtn">Next →</button>
</div>

<div id="currentContent" class="content">
  <div>Level 1 – Ready to Jump</div>
</div>

<div id="nextContent" class="content">
  <div>Level 2 – Arrived!</div>
</div>

<script>
// ------------------------------------------------------------
// 1. Canvas & basic helpers
// ------------------------------------------------------------
const canvas = document.getElementById('warpCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ------------------------------------------------------------
// 2. Starfield (normal & warp)
// ------------------------------------------------------------
const STAR_COUNT = 600;
const stars = [];

class Star {
  constructor() { this.reset(true); }
  reset(isNormal = false) {
    this.x = (Math.random() - 0.5) * w * 2;
    this.y = (Math.random() - 0.5) * h * 2;
    this.z = isNormal ? Math.random() * 300 + 50 : Math.random() * 100 + 10;
    this.baseZ = this.z;
    this.size = 1;
    this.twinklePhase = Math.random() * Math.PI * 2;
  }
}
for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());

// ------------------------------------------------------------
// 3. Transition state machine
// ------------------------------------------------------------
const PHASES = {
  NORMAL: 0,
  FADE_OUT: 1,
  FLASH: 2,
  WARP: 3,
  FADE_IN: 4,
  DONE: 5
};
let phase = PHASES.NORMAL;
let phaseTimer = 0;
let flashAlpha = 0;

// Durations (seconds)
const DUR = {
  FADE_OUT: 0.8,
  FLASH: 0.3,
  WARP: 2.5,
  FADE_IN: 0.8
};

// ------------------------------------------------------------
// 4. Animation loop
// ------------------------------------------------------------
let last = 0;
function animate(t = 0) {
  const dt = Math.min((t - last) / 1000, 0.1);
  last = t;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  if (phase === PHASES.NORMAL || phase === PHASES.FADE_IN || phase === PHASES.DONE) {
    drawNormalStarfield(dt);
  }

  // Phase logic
  phaseTimer += dt;
  switch (phase) {
    case PHASES.FADE_OUT:
      if (phaseTimer >= DUR.FADE_OUT) nextPhase();
      break;
    case PHASES.FLASH:
      flashAlpha = Math.sin((phaseTimer / DUR.FLASH) * Math.PI);
      if (phaseTimer >= DUR.FLASH) nextPhase();
      break;
    case PHASES.WARP:
      drawWarpStarfield(dt);
      if (phaseTimer >= DUR.WARP) nextPhase();
      break;
    case PHASES.FADE_IN:
      drawNormalStarfield(dt);
      if (phaseTimer >= DUR.FADE_IN) nextPhase();
      break;
  }

  // Flash overlay
  if (phase === PHASES.FLASH) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha * 0.9})`;
    ctx.fillRect(0, 0, w, h);
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ------------------------------------------------------------
// 5. Drawing helpers
// ------------------------------------------------------------
function drawNormalStarfield(dt) {
  for (const s of stars) {
    // Twinkle
    const twinkle = 0.5 + 0.5 * Math.sin(s.twinklePhase + performance.now() * 0.002);
    const size = s.size * twinkle;
    ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
    ctx.fillRect(s.x + w/2 - size/2, s.y + h/2 - size/2, size, size);
  }
}

function drawWarpStarfield(dt) {
  const speed = 800 + Math.sin(phaseTimer * 3) * 300; // pulsing speed
  for (const s of stars) {
    s.z -= speed * dt;
    if (s.z <= 0) s.reset();

    const projX = (s.x / s.z) * 200 + w/2;
    const projY = (s.y / s.z) * 200 + h/2;
    const size = (300 / s.z) * 2;

    // Color shift to blue/purple
    const hue = 260 + (s.z / 300) * 40;
    ctx.fillStyle = `hsla(${hue},100%,70%,0.9)`;
    ctx.beginPath();
    ctx.arc(projX, projY, size, 0, Math.PI*2);
    ctx.fill();

    // Streak line
    const tailLength = size * 8;
    const tailX = projX - (projX - w/2) * (tailLength / size);
    const tailY = projY - (projY - h/2) * (tailLength / size);
    ctx.strokeStyle = `hsla(${hue},100%,70%,0.4)`;
    ctx.lineWidth = size * 0.6;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(projX, projY);
    ctx.stroke();
  }
}

// ------------------------------------------------------------
// 6. Phase control
// ------------------------------------------------------------
function nextPhase() {
  phaseTimer = 0;
  phase++;
  if (phase === PHASES.DONE) endTransition();
}
function endTransition() {
  // Fade canvas out
  canvas.style.opacity = '0';
  // Show new content
  document.getElementById('nextContent').style.opacity = '1';
  document.getElementById('currentContent').style.opacity = '0';
}

// ------------------------------------------------------------
// 7. UI – trigger transition
// ------------------------------------------------------------
document.getElementById('nextBtn').addEventListener('click', () => {
  const btn = document.getElementById('nextBtn');
  btn.disabled = true;
  btn.textContent = 'Jumping…';

  // Hide current content immediately
  document.getElementById('currentContent').style.opacity = '0';

  // Reset stars to a “normal” state for the start of the jump
  stars.forEach(s => s.reset(true));

  // Reset transition
  phase = PHASES.FADE_OUT;
  phaseTimer = 0;
  flashAlpha = 0;
  canvas.style.opacity = '1';

  // (Optional) preload next level assets here…
  // setTimeout(() => preloadNextLevel(), 200);

  // When transition finishes, re-enable button for next use
  const onDone = () => {
    btn.disabled = false;
    btn.textContent = 'Next →';
    canvas.removeEventListener('transitionend', onDone);
  };
  canvas.addEventListener('transitionend', onDone);
});

/* ------------------------------------------------------------
   OPTIONAL: Swap the two demo divs so you can click “Next”
   again to see the reverse (for demo purposes only).
   ------------------------------------------------------------ */
let swapped = false;
document.getElementById('nextBtn').addEventListener('click', () => {
  if (phase === PHASES.DONE) {
    swapped = !swapped;
    const cur = swapped ? 'nextContent' : 'currentContent';
    const nxt = swapped ? 'currentContent' : 'nextContent';
    document.getElementById(cur).style.opacity = '0';
    setTimeout(() => {
      document.getElementById(nxt).style.opacity = '1';
    }, 600);
  }
});
</script>
</body>
</html>
