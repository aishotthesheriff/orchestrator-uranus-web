services:
  mariadb:
    # Keep this version in step with the production server (see docs_master/current/DATABASE.md).
    image: mariadb:11.8
    environment:
      # Lets a data volume made by an older image be upgraded in place when the version changes
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: uranus_dungeon
      MARIADB_USER: uranus
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
    volumes:
      - mariadb_data:/var/lib/mysql
      # Creates the uranus_dungeon_test database on first start
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: uranus-dungeon:${IMAGE_TAG:-latest}
    labels:
      - "project=uranus-dungeon"
      - "environment=${NODE_ENV:-development}"
    environment:
      DATABASE_URL: mysql://uranus:password@mariadb:3306/uranus_dungeon
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY}
      TEST_API_KEY: ${TEST_API_KEY}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5001}
      SESSION_SECRET: ${SESSION_SECRET}
      HF_TOKEN: ${HF_TOKEN}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      CONSOLE_LLM_LOG: false
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-quest-to-uranus}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-false}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-false}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    volumes:
      - ./generated_images:/app/generated_images
      - ./attached_assets:/app/attached_assets
      - ./releases:/app/releases
      - ./logs:/app/logs
      - .:/app
      - /app/node_modules

volumes:
  mariadb_data:
    driver: local
